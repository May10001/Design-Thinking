[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadline-keeper-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "anyio>=4,<5", "uvicorn>=0.30,<1", "pydantic>=2,<3", "SQLAlchemy>=2,<2.1", "alembic>=1.13,<2", "httpx>=0.27,<1", "python-dotenv>=1,<2", "Pillow>=10,<12", "python-multipart>=0.0.9,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
ocr = ["paddlepaddle>=3.0,<4", "paddleocr>=3.0,<4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
